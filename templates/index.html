<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>NYT Letterboxed Puzzle Solver</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            text-align: center;
        }
        .square-container {
            display: inline-block;
            margin: 20px;
            position: relative;
        }
        .row {
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 2;
        }
        .middle-section {
            display: flex;
            justify-content: space-between;
            width: 261px;
            margin: 10px auto;
            height: 150px;
            position: relative;
        }
        .side {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 2;
        }
        .center-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 185px;
            height: 185px;
            background-color: #f0f0f0;
            border: 2px solid #ccc;
            z-index: 1;
            border-radius: 5px;
        }
        input {
            width: 30px;
            height: 30px;
            margin: 5px;
            text-align: center;
            text-transform: uppercase;
            border: 1px solid #999;
            border-radius: 4px;
            background-color: white;
            -webkit-appearance: none;
            appearance: none;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.3s ease;
            caret-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }
        input.highlight-green {
            background-color: #4CAF50;
            border-color: #4CAF50;
            color: white;
        }
        input.highlight-blue {
            background-color: #ADD8E6;
            border-color: #ADD8E6;
            color: black;
        }
        #solution {
            margin-top: 20px;
            padding: 10px;
            min-height: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            margin-right: 10px;
        }
        button:last-child {
            margin-right: 0;
        }
        button:hover {
            background-color: #45a049;
        }
        #lineContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        .solution-line {
            stroke: #4CAF50;
            stroke-width: 5;
            stroke-linecap: round;
            fill: none;
        }
        /* New styles for word formation display */
        #wordFormationArea {
            margin: 20px auto;
            min-height: 60px;
            width: 80%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .word-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .word1 {
            color: #4CAF50;
            font-weight: bold;
            font-size: 28px;
            letter-spacing: 2px;
        }
        .word2 {
            color: #ADD8E6;
            font-weight: bold;
            font-size: 28px;
            letter-spacing: 2px;
        }
        .word-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        #word1Display, #word2Display {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .letter {
            display: inline-block;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #loading-message {
            display: none;
            margin: 20px 0;
        }
        .switch-container {
            margin: 20px auto; /* Changed from just margin: 20px */
            display: flex;
            align-items: center;
            justify-content: center; /* Added this line */
            gap: 10px;
            width: fit-content;
        }


        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2196F3;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }
        .date-selector {
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        select {
            padding: 8px 12px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #999;
            background-color: white;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #4CAF50;
        }

        /* Add loading overlay styles */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
/* 
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: relative;
        } */
    </style>
</head>

            function findAllSolutions(){
                if (!window.trie) return [];

            $('#solveButton').on('click', function() {

            function checkForWin() {
                // Get all 12 grid letters
                const gridIds = [
                    'top1', 'top2', 'top3',
                    'left1', 'left2', 'left3',

                });

                console.log(usedLetters)
                // Check if every grid letter is present in usedLetters
                return gridLetters.every(letter => usedLetters.includes(letter));
            }

                    // Check if word is valid using searchWord

                }

            function getSideIndex(inputId) {
                if (inputId.startsWith('top')) return 0;
                if (inputId.startsWith('left')) return 1;
                if (inputId.startsWith('right')) return 2;
                if (inputId.startsWith('bottom')) return 3;
                return -1;
            }



            // Display selected letters
            function updateSelectedLettersDisplay() {
                console.log(selectedLetters);
                console.log(selectedLettersArray);
                let gridIds = [
                    'top1', 'top2', 'top3',
                    'left1', 'left2', 'left3',
                    'right1', 'right2', 'right3',
                    'bottom1', 'bottom2', 'bottom3'
                ];

                // Build sets for quick lookup
                let selectedSet = new Set(selectedLetters.map(l => l.toUpperCase()));
                let arraySet = new Set();
                selectedLettersArray.forEach(arr => {
                    arr.forEach(l => arraySet.add(l.toUpperCase()));
                });

                // Update input backgrounds
                gridIds.forEach(id => {
                    let $input = $('#' + id);
                    let val = $input.val().toUpperCase();
                    $input.removeClass('highlight-blue highlight-gray');
                    if (selectedSet.has(val)) {
                        $input.addClass('highlight-blue');
                    } else if (arraySet.has(val)) {
                        $input.addClass('highlight-gray');
                    }
                });

                // Add highlight-gray style if not present
                if ($('style').text().indexOf('.highlight-gray') === -1) {
                    $('<style>.highlight-gray{background-color:#e0e0e0;border-color:#e0e0e0;color:#333;}</style>').appendTo('head');
                }
                if ($('#selectedLetters').length === 0) {
                    $('<div id="selectedLetters" style="margin-top:20px;font-size:24px;font-weight:bold;"></div>').insertAfter('.square-container');
                }
                $('#selectedLetters').text(selectedLetters.join(''));
                let allWords = selectedLettersArray.map(arr => arr.join('')).join(' ');
                let currentWord = selectedLetters.join('');
                let displayText = [allWords, currentWord].filter(Boolean).join(' ');
                $('#selectedLetters').text(displayText);
                // Draw lines connecting letters
                let $svg = $('#lineContainer');
                $svg.empty();

                // Helper to get center coordinates of an input
                function getInputCenter(id) {
                    if (!id) return {x: 0, y: 0};
                    let $input = $('#' + id);
                    let offset = $input.offset();
                    let parentOffset = $svg.parent().offset();
                    if (!offset || !parentOffset) {
                        return {x: 0, y: 0};
                    }
                    let x, y;
                    let width = $input.outerWidth();
                    let height = $input.outerHeight();

                    // Determine position based on input id
                    if (id.startsWith('left')) {
                        // Center right
                        x = offset.left - parentOffset.left + width;
                        y = offset.top - parentOffset.top + height / 2;
                    } else if (id.startsWith('right')) {
                        // Center left
                        x = offset.left - parentOffset.left;
                        y = offset.top - parentOffset.top + height / 2;
                    } else if (id.startsWith('top')) {
                        // Center bottom
                        x = offset.left - parentOffset.left + width / 2;
                        y = offset.top - parentOffset.top + height;
                    } else if (id.startsWith('bottom')) {
                        // Center top
                        x = offset.left - parentOffset.left + width / 2;
                        y = offset.top - parentOffset.top;
                    } else {
                        // Default to center
                        x = offset.left - parentOffset.left + width / 2;
                        y = offset.top - parentOffset.top + height / 2;
                    }
                    return {x, y};
                }

                // Map letter to input id (first match)
                function letterToId(letter, usedIds) {
                    letter = letter.toUpperCase();
                    for (let id of gridIds) {
                        if ($('#' + id).val().toUpperCase() === letter) {
                            return id;
                        }
                    }
                    return null;
                }

                // Draw gray lines for selectedLettersArray
                let usedIdsGray = new Set();

                selectedLettersArray.forEach(arr => {
                    let prevId = null; // Reset for each word
                    for(let i = 1; i < arr.length; i++){
                        console.log("Drawing line for letter pair: " + arr[i-1] + " to " + arr[i]);
                        let p1 = getInputCenter(letterToId(arr[i-1], usedIdsGray));
                        let p2 = getInputCenter(letterToId(arr[i], usedIdsGray));
                        let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                        line.setAttribute("x1", p1.x);
                        line.setAttribute("y1", p1.y);
                        line.setAttribute("x2", p2.x);
                        line.setAttribute("y2", p2.y);
                        line.setAttribute("stroke", "#888");
                        line.setAttribute("stroke-width", "5");
                        line.setAttribute("stroke-linecap", "round");
                        $svg[0].appendChild(line);
                    }
                });

                // Draw blue lines for selectedLetters
                let usedIdsBlue = new Set();
                prevId = null;
                selectedLetters.forEach(letter => {
                    let id = letterToId(letter, usedIdsBlue);
                    if (prevId && id) {
                        let p1 = getInputCenter(prevId);
                        let p2 = getInputCenter(id);
                        let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                        line.setAttribute("x1", p1.x);
                        line.setAttribute("y1", p1.y);
                        line.setAttribute("x2", p2.x);
                        line.setAttribute("y2", p2.y);
                        line.setAttribute("stroke", "#2196F3");
                        line.setAttribute("stroke-width", "5");
                        line.setAttribute("stroke-linecap", "round");
                        $svg[0].appendChild(line);
                    }
                    prevId = id;
                });
                console.log('Updated selected letters display');
            }

            // Handle letter click
            $("input[type='text']").on("click", function() {
                const letter = $(this).val();
                const side = getSideIndex(this.id);

                // Prevent selecting two consecutive letters from the same side
                if (selectedSides.length > 0 && selectedSides[selectedSides.length - 1] === side) {
                    return; // Ignore click
                }
                selectedLetters.push(letter);
                selectedSides.push(side);
                updateSelectedLettersDisplay();
            });

            // Handle keyboard input
            $(document).on("keydown", function(e) {
                if(window.disable) return;
                console.log('Key pressed:', e.key);
                const key = e.key.toUpperCase();
                console.log(key)
                // Enter key triggers "Enter" button
                if (e.key === "Enter") {
                    e.preventDefault(); // Prevent default behavior (e.g., form submission)
                    e.stopPropagation(); // Stop event from bubbling to other handlers
                    $('#enterSelection').click();
                    return;
                }
                console.log(e.key)
                // Backspace or Delete triggers "Back" button
                if (e.key === "Backspace" || e.key === "Delete") {
                    $('#backSelection').click();
                    return;
                }

                $("input[type='text']").each(function() {
                    if ($(this).val().toUpperCase() === key) {
                        const side = getSideIndex(this.id);
                        if (selectedSides.length === 0 || selectedSides[selectedSides.length - 1] !== side) {
                            selectedLetters.push(key);
                            selectedSides.push(side);
                            updateSelectedLettersDisplay();
                            return false; // break loop
                        }
                    }
                });
            });
            function searchWord(trie, word) {
                let current = trie;
                
                for (let char of word) {
                    if (!current.children[char]) {
                        return false; // Word not found
                    }
                    current = current.children[char];
                }
                
                return current.is_end_of_word;
            }

        });
        
    </script>
</body>
</html>
